version: '3.8'

services:
  familylink-auth:
    # Option 1: Use pre-built standalone image (recommended after v0.9.2)
    image: ghcr.io/noiwid/familylink-auth:standalone
    # Option 2: Build locally from Dockerfile.standalone
    # build:
    #   context: .
    #   dockerfile: Dockerfile.standalone
    container_name: familylink-auth
    ports:
      - "8099:8099"  # Web interface
      - "6080:6080"  # noVNC web interface
    volumes:
      - ./data:/share/familylink:rw
    # Increase shared memory size for Chromium (default 64MB is too small)
    shm_size: '2gb'
    environment:
      - LOG_LEVEL=info
      - AUTH_TIMEOUT=300
      - SESSION_DURATION=86400
      # VNC password of the browser view. Unset: a random one is generated at
      # every start and printed in the container log.
      # - VNC_PASSWORD=choose-your-own
      - LANGUAGE=en-US
      - TIMEZONE=Europe/Paris
      # Key protecting /api/cookies. Unset: one is generated once, kept in
      # ./data/api_key and printed in the container log. Either way, enter it
      # in the HA integration's separate masked API-key field and use
      # http://<host>:8099 as the URL.
      # - API_KEY=change-me
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
