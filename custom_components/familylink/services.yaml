# Services for Google Family Link integration

block_device_for_school:
  name: Block Device for School
  description: "Block all apps except essential ones to simulate device lock during school hours. Needs a child (entity or child_id), or all_children: true for every supervised child."
  fields:
    whitelist:
      name: Additional Whitelist
      description: Additional package names to keep allowed (beyond the default essential apps). Enter one package name per line.
      required: false
      example:
        - "com.example.educationalapp"
        - "com.microsoft.teams"
      selector:
        text:
          multiple: true
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    all_children:
      name: All children
      description: Apply to every supervised child. Required when no child is given (entity or child_id).
      required: false
      default: false
      selector:
        boolean:

unblock_all_apps:
  name: Unblock All Apps
  description: "Unblock all apps to end school mode and restore normal device usage. Needs a child (entity or child_id), or all_children: true for every supervised child."
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    all_children:
      name: All children
      description: Apply to every supervised child. Required when no child is given (entity or child_id).
      required: false
      default: false
      selector:
        boolean:

block_app:
  name: Block App
  description: "Block a specific app by package name. Needs a child (entity or child_id), or all_children: true for every supervised child."
  fields:
    package_name:
      name: Package Name
      description: Android package name to block (e.g., com.youtube.android)
      required: true
      example: "com.youtube.android"
      selector:
        text:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    all_children:
      name: All children
      description: Apply to every supervised child. Required when no child is given (entity or child_id).
      required: false
      default: false
      selector:
        boolean:

unblock_app:
  name: Unblock App
  description: "Unblock a specific app by package name. Needs a child (entity or child_id), or all_children: true for every supervised child."
  fields:
    package_name:
      name: Package Name
      description: Android package name to unblock
      required: true
      example: "com.youtube.android"
      selector:
        text:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    all_children:
      name: All children
      description: Apply to every supervised child. Required when no child is given (entity or child_id).
      required: false
      default: false
      selector:
        boolean:

set_app_daily_limit:
  name: Set App Daily Limit
  description: "Set a daily time limit for a specific app. Use -2 for unlimited time (ignores device limits). Use -1 to disable app limit (follows device limits). Use 0 for completely blocked. Needs a child (entity or child_id), or all_children: true for every supervised child."
  fields:
    package_name:
      name: Package Name
      description: Android package name (e.g., com.zhiliaoapp.musically for TikTok)
      required: true
      example: "com.zhiliaoapp.musically"
      selector:
        text:
    minutes:
      name: Daily Limit (minutes)
      description: "Daily time limit: -2 = unlimited time (ignores device limits), -1 = app limit off (follows device limits), 0 = blocked, 1-1440 = limit in minutes"
      required: true
      example: 60
      default: 60
      selector:
        number:
          min: -2
          max: 1440
          mode: box
          unit_of_measurement: "minutes"
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    all_children:
      name: All children
      description: Apply to every supervised child. Required when no child is given (entity or child_id).
      required: false
      default: false
      selector:
        boolean:

pause_app:
  name: Pause App
  description: "Pause apps for one child by setting their daily limit to 1 minute. The app stays installed (blocking hides it, and a blocked Google Messages loses incoming texts). An app already used today pauses at once; an app not used yet gets its 1 minute first. The previous setting is saved and resume_app puts it back. Does nothing on Google TV, which ignores app limits. A child is required."
  fields:
    packages:
      name: Packages
      description: Android package names to pause
      required: true
      example: "com.google.android.apps.messaging"
      selector:
        text:
          multiple: true
    entity_id:
      name: Child Entity
      description: Any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

resume_app:
  name: Resume App
  description: "Put back the daily limit setting that apps had before pause_app (a limit, unlimited time, or no limit). Apps that pause_app did not pause are left alone, and so is an app blocked since the pause (its saved setting is kept for when it is unblocked). A child is required."
  fields:
    packages:
      name: Packages
      description: Android package names to resume. Leave empty to resume every app paused for the child.
      required: false
      example: "com.google.android.apps.messaging"
      selector:
        text:
          multiple: true
    entity_id:
      name: Child Entity
      description: Any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

# Time management services

add_time_bonus:
  name: Add Time Bonus
  description: Add extra screen time bonus to a device (e.g., 30 minutes). You can either select a device entity OR provide device_id/child_id manually.
  fields:
    entity_id:
      name: Device Entity
      description: Select a Family Link device switch (recommended - automatically extracts device_id and child_id)
      required: false
      selector:
        entity:
          integration: familylink
          domain: switch
    bonus_minutes:
      name: Bonus Minutes
      description: Number of minutes to add as bonus time (1-1440)
      required: true
      example: 30
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          mode: box
          unit_of_measurement: "minutes"
    device_id:
      name: Device ID (manual)
      description: Device ID (device token) - only needed if not using entity selector
      required: false
      example: "ABCD1234567890"
      selector:
        text:
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

enable_bedtime:
  name: Enable Bedtime
  description: Enable bedtime (downtime) restrictions for a child. You can either select an entity OR provide child_id manually.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

disable_bedtime:
  name: Disable Bedtime
  description: Disable bedtime (downtime) restrictions for a child. You can either select an entity OR provide child_id manually.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID. Given alone (no entity, no device_id), the limit is applied to every device of that child.
      required: false
      example: "123456789012345678901"
      selector:
        text:

set_bedtime:
  name: Set Bedtime
  description: >-
    Set bedtime start and end times. By default this edits the recurring WEEKLY
    schedule for the given day (like Family Link's "Weekly schedule"); use
    scope "today" for a one-off "tonight only" override that leaves the weekly
    schedule unchanged. If no day is specified, applies to today.
  fields:
    start_time:
      name: Start Time
      description: Bedtime start time (e.g., 20:45)
      required: true
      example: "20:45"
      selector:
        time:
    end_time:
      name: End Time
      description: Bedtime end time, typically next morning (e.g., 07:30)
      required: true
      example: "07:30"
      selector:
        time:
    day:
      name: Day
      description: Day of the week. If not specified, applies to today.
      required: false
      selector:
        select:
          options:
            - label: "Monday"
              value: "1"
            - label: "Tuesday"
              value: "2"
            - label: "Wednesday"
              value: "3"
            - label: "Thursday"
              value: "4"
            - label: "Friday"
              value: "5"
            - label: "Saturday"
              value: "6"
            - label: "Sunday"
              value: "7"
    scope:
      name: Scope
      description: >-
        "weekly" (default) edits the recurring weekly schedule for the day.
        "today" posts a one-off override for that day only, leaving the weekly
        schedule untouched.
      required: false
      default: weekly
      selector:
        select:
          options:
            - label: "Weekly schedule"
              value: "weekly"
            - label: "Today only"
              value: "today"
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

set_downtime_unlimited_apps:
  name: Set Unlimited Apps During Downtime
  description: >-
    Allow or block the apps with unlimited time during downtime (bedtime), the
    "Allow apps with unlimited time during downtime" setting of Family Link.
    The setting belongs to the child and applies to all of the child's
    devices. You can either select an entity OR provide child_id manually.
  fields:
    allow:
      name: Allow
      description: >-
        On: the apps with unlimited time stay usable during downtime. Off: they
        are blocked during downtime too.
      required: true
      example: false
      selector:
        boolean:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

enable_school_time:
  name: Enable School Time
  description: Enable school time (evening limit) restrictions for a child. You can either select an entity OR provide child_id manually.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

disable_school_time:
  name: Disable School Time
  description: Disable school time (evening limit) restrictions for a child. You can either select an entity OR provide child_id manually.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

set_school_time:
  name: Set School Time
  description: >-
    Set the School Time start and finish for a day. By default this edits the
    recurring WEEKLY school time slot of that day (the day must already have a
    school time window in Family Link). Use scope "today" for a one-off
    override of today's school time that leaves the weekly schedule unchanged.
    If no day is specified, applies to today.
  fields:
    start_time:
      name: Start Time
      description: School time start (e.g., 08:00)
      required: true
      example: "08:00"
      selector:
        time:
    end_time:
      name: End Time
      description: School time end, same day and after the start (e.g., 13:15)
      required: true
      example: "13:15"
      selector:
        time:
    day:
      name: Day
      description: Day of the week. If not specified, applies to today.
      required: false
      selector:
        select:
          options:
            - label: "Monday"
              value: "1"
            - label: "Tuesday"
              value: "2"
            - label: "Wednesday"
              value: "3"
            - label: "Thursday"
              value: "4"
            - label: "Friday"
              value: "5"
            - label: "Saturday"
              value: "6"
            - label: "Sunday"
              value: "7"
    scope:
      name: Scope
      description: >-
        "weekly" (default) edits the recurring weekly school time slot of the
        day. "today" posts a one-off school time window for today only.
      required: false
      default: weekly
      selector:
        select:
          options:
            - label: "Weekly schedule"
              value: "weekly"
            - label: "Today only"
              value: "today"
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

enable_daily_limit:
  name: Enable Daily Limit
  description: Enable daily time limit for a child. You can either select an entity OR provide child_id manually.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

disable_daily_limit:
  name: Disable Daily Limit
  description: Disable daily time limit for a child. You can either select an entity OR provide child_id manually.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (recommended - automatically extracts child_id)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

set_daily_limit:
  name: Set Daily Limit
  description: Set daily time limit duration for a device (e.g., 120 minutes for 2 hours). Select a device entity, provide a device_id, or provide only a child_id to apply the limit to every device of that child that takes time limits (not a Google TV).
  fields:
    day:
      name: Day of week
      description: "Weekday the quota applies to (1 = Monday ... 7 = Sunday). Defaults to today. Another day sets that weekday's quota, as the Family Link weekly limits screen does."
      required: false
      example: 6
      selector:
        number:
          min: 1
          max: 7
          mode: box
    entity_id:
      name: Device Entity
      description: Select a Family Link device switch (recommended - automatically extracts device_id and child_id)
      required: false
      selector:
        entity:
          integration: familylink
          domain: switch
    daily_minutes:
      name: Daily Minutes
      description: Number of minutes allowed per day (0-1440). Use 0 to disable the device for the day without fully locking it.
      required: true
      example: 120
      default: 120
      selector:
        number:
          min: 0
          max: 1440
          mode: box
          unit_of_measurement: "minutes"
    device_id:
      name: Device ID (manual)
      description: Device ID (device token) - only needed if not using entity selector
      required: false
      example: "ABCD1234567890"
      selector:
        text:
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

# Location services

refresh_location:
  name: Refresh Location
  description: Request a fresh location update from the child's device. This forces the device to send its current GPS position (uses more battery than cached location). If no child is specified, refreshes location for ALL supervised children.
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity for this child (optional - if not specified, applies to ALL children)
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector. If not specified, applies to ALL children.
      required: false
      example: "123456789012345678901"
      selector:
        text:

ring_device:
  name: Ring Device
  description: Make a Family Link device ring (sound) to help locate it. Select a device entity OR provide device_id/child_id manually.
  fields:
    entity_id:
      name: Device Entity
      description: Select a Family Link device entity (recommended - automatically extracts device_id and child_id)
      required: false
      selector:
        entity:
          integration: familylink
          domain: button
    device_id:
      name: Device ID (manual)
      description: Device ID (device token) - only needed if not using entity selector
      required: false
      example: "ABCD1234567890"
      selector:
        text:
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:


set_update_interval:
  name: Set Update Interval
  description: Change how often the integration polls Google, until the next reload or restart (the value from the integration options applies again afterwards). Lets an automation poll less often at night and more often during the day.
  fields:
    seconds:
      name: Interval (seconds)
      description: Polling interval in seconds, between 30 and 3600
      required: true
      example: 600
      selector:
        number:
          min: 30
          max: 3600
          unit_of_measurement: seconds
          mode: box

get_sites:
  name: Get Sites
  description: "Read a child's Chrome site lists (Family Link 'Google Chrome and Web'): the filter level and every approved and blocked site, including ones added in the Family Link app. Returns the lists as a response."
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:

block_site:
  name: Block Site
  description: "Block websites in the child's Chrome (all devices where the child is signed in to Chrome). A site that was approved becomes blocked. Only Chrome is filtered: other browsers need block_app."
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    sites:
      name: Sites
      description: "Websites (www.example.com), domain wildcards (*.example.com, *.example.*) or web addresses (https://example.com/page). Wildcards only as a leading '*.' or a trailing '.*'."
      required: true
      example: "www.example.com"
      selector:
        text:
          multiple: true

allow_site:
  name: Allow Site
  description: "Approve websites in the child's Chrome. A site that was blocked becomes approved. A block on a wider pattern (e.g. *.example.*) still wins over an approval."
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    sites:
      name: Sites
      description: "Websites (www.example.com), domain wildcards (*.example.com, *.example.*) or web addresses (https://example.com/page). Wildcards only as a leading '*.' or a trailing '.*'."
      required: true
      example: "www.example.com"
      selector:
        text:
          multiple: true

remove_site:
  name: Remove Site
  description: "Remove websites from the child's approved or blocked list, whoever added them."
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    sites:
      name: Sites
      description: "Websites (www.example.com), domain wildcards (*.example.com, *.example.*) or web addresses (https://example.com/page). Wildcards only as a leading '*.' or a trailing '.*'."
      required: true
      example: "www.example.com"
      selector:
        text:
          multiple: true

sync_site_list:
  name: Sync Site List
  description: "Keep the child's blocked sites in step with a published list of domains (one per line, '#' comments). Adds what the list gained, removes only what this list added before and has since dropped; entries made by hand and approved sites are left alone. The list comes from a third party, so it must be served over https, is read up to 1 MiB, and only plain domains are taken (wildcards, web addresses, IP addresses and bare suffixes such as co.uk are ignored). An answer with no usable domain, or one that would remove most of what the list added, is refused; stop removes everything the list added. Administrators only."
  fields:
    entity_id:
      name: Child Entity
      description: Select any Family Link entity of the child
      required: false
      selector:
        entity:
          integration: familylink
    child_id:
      name: Child ID (manual)
      description: Child's user ID - only needed if not using the entity selector
      required: false
      example: "123456789012345678901"
      selector:
        text:
    url:
      name: List URL
      description: "Raw https URL of the domain list, one domain per line"
      required: true
      example: "https://example.org/blocklist.txt"
      selector:
        text:
          type: url
    max_domains:
      name: Maximum Domains
      description: Refuse a list longer than this (safety cap).
      required: false
      default: 2000
      selector:
        number:
          min: 1
          max: 2000
          mode: box
    stop:
      name: Stop Syncing
      description: Remove everything this list added for the child and stop tracking it.
      required: false
      default: false
      selector:
        boolean:
