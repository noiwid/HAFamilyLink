name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  home-assistant-current:
    name: Home Assistant 2026.9.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test-homeassistant.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test-homeassistant.txt
      - name: Run integration tests
        run: >-
          python -m pytest --disable-socket --allow-unix-socket
          tests/custom_components/familylink

  home-assistant-minimum:
    name: Home Assistant 2024.4.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-homeassistant-minimum.txt
      - name: Install minimum-version dependencies
        run: |
          python -m pip install --requirement requirements-test-homeassistant-minimum.txt
          # This historical harness metadata references an unavailable,
          # development-only mypy build. Extract its pinned wheel without
          # installing that obsolete metadata; runtime dependencies are pinned.
          python -m pip download --no-deps --only-binary=:all: \
            pytest-homeassistant-custom-component==0.13.111 \
            --dest "$RUNNER_TEMP/ha-test-wheel"
          python -m zipfile -e \
            "$RUNNER_TEMP/ha-test-wheel/pytest_homeassistant_custom_component-0.13.111-py3-none-any.whl" \
            "$RUNNER_TEMP/ha-test-harness"
          python -m pip check
      - name: Run integration tests
        env:
          PYTHONPATH: ${{ runner.temp }}/ha-test-harness
        run: >-
          python -m pytest --disable-socket --allow-unix-socket
          tests/custom_components/familylink
