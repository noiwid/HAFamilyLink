# Family Link example dashboard (the screenshot in examples/dashboard.png).
# Every card ships with the integration: nothing to install from the Marketplace, no helper, no script.
# Replace the placeholders (see examples/README.md): switch.kids_phone, switch.kids_tablet,
# device_tracker.firstname_name_family_link.
title: Family Link
views:
  - title: Parental Control
    path: parental-control
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # the phone: header, bonus bar, restriction tiles, apps, websites, weekly limits
          - type: custom:familylink-card
            entity: switch.kids_phone
            title: Kid's phone
          # a second device of the same child: header and bonus bar only
          - type: custom:familylink-card
            entity: switch.kids_tablet
            title: Kid's tablet
            compact: true
      - type: grid
        cards:
          # today's screen time of the devices together, with the hourly chart and the daily history below
          - type: custom:parental-screen-time-card
            devices:
              - entity: switch.kids_phone
                name: Kid's phone
              - entity: switch.kids_tablet
                name: Kid's tablet
            history: true
            days: 14
      - type: grid
        column_span: 2
        cards:
          # needs location tracking enabled in the integration options
          - type: custom:familylink-location-card
            entity: device_tracker.firstname_name_family_link
            height: 300
